name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  verify:
    name: Verify (typecheck, lint, prettier, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Check code formatting
        run: npx prettier --check .

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: 'https://placeholder.domain'
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder-anon-key'
          SUPABASE_SERVICE_ROLE_KEY: 'placeholder-service-key'
          RESEND_API_KEY: 're_placeholder_key'
          CLOUDFLARE_ACCOUNT_ID: 'placeholder-account-id'
          CLOUDFLARE_API_TOKEN: 'placeholder-api-token'
          CLOUDFLARE_IMAGE_MODEL: '@cf/stabilityai/stable-diffusion-xl-base-1.0'
          IP_HASH_SALT: 'placeholder-salt'
          IMAGE_DAILY_GLOBAL_LIMIT: '50'
          ENHANCE_DAILY_IP_LIMIT: '10'
          ENHANCE_DAILY_GLOBAL_LIMIT: '100'
